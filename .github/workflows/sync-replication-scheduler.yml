name: Scheduled Neon Supabase replication

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-supabase-replication
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SYNC_CRON_SECRET: ${{ secrets.SYNC_CRON_SECRET }}
    steps:
      - name: Validate scheduler secret
        shell: bash
        run: |
          if [[ -z "$SYNC_CRON_SECRET" ]]; then
            echo "::error::Repository secret SYNC_CRON_SECRET is not configured."
            exit 1
          fi

      - name: Trigger one bounded reconciliation cycle
        shell: bash
        run: |
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 120 \
            --retry 2 \
            --retry-all-errors \
            --retry-delay 5 \
            --request POST \
            --header "Authorization: Bearer ${SYNC_CRON_SECRET}" \
            --header "Accept: application/json" \
            "https://apprendiamo-italiano-backend.vercel.app/internal/sync/reconcile"
