name: Sync replication integration tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  postgres-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      neon:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d neon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      supabase:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: supabase_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d supabase_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TESTING: "1"
      SECRET_KEY: "test-only-secret-key-for-apprendiamo-backend"
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/neon_test"
      SUPABASE_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@127.0.0.1:5433/supabase_test"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio
      - name: Run real PostgreSQL replication integration test
        run: python -m pytest -q tests/test_sync_replication_integration.py
